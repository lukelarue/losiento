<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>¡Lo Siento!</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <main class="app-main">
        <section id="screen-loading" class="screen">
          <p>Loading your game&hellip;</p>
        </section>

        <section id="screen-no-game" class="screen hidden">
          <h2>No active game</h2>
          <div class="layout-row">
            <div class="card">
              <h3>Host a game</h3>
              <form id="host-form">
                <label>
                  Display name
                  <input type="text" id="host-display-name" placeholder="Your name" />
                </label>
                <label>
                  Seats (2&ndash;4)
                  <input type="number" id="host-max-seats" min="2" max="4" value="4" />
                </label>
                <button type="submit">Host</button>
              </form>
            </div>

            <div class="card">
              <h3>Join a game</h3>
              <button id="refresh-joinable">Refresh list</button>
              <ul id="joinable-list" class="joinable-list"></ul>
            </div>
          </div>
        </section>

        <section id="screen-lobby" class="screen hidden">
          <h2>Lobby</h2>
          <div id="lobby-meta" class="lobby-meta"></div>
          <div id="lobby-seats" class="lobby-seats"></div>
          <div class="lobby-actions">
            <button id="start-game">Start game</button>
            <button id="leave-lobby">Leave game</button>
          </div>
        </section>

        <section id="screen-game" class="screen hidden">
          <div class="game-layout">
            <div class="game-left">
              <div class="game-left-top">
                <button id="leave-game">Leave game</button>
              </div>
              <div class="game-card-panel">
                <div id="game-card" class="game-card-surface"></div>
              </div>
              <div class="card">
                <div id="game-status-pills"></div>
              </div>
              <div class="settings-section">
                <h4>Bot Autoplay</h4>
                <div class="autoplay-toggle">
                  <button id="autoplay-off" class="autoplay-btn">Off</button>
                  <button id="autoplay-slow" class="autoplay-btn">Slow</button>
                  <button id="autoplay-fast" class="autoplay-btn autoplay-btn-active">Fast</button>
                </div>
              </div>
              <div class="settings-section">
                <h4>Board Style</h4>
                <div class="interface-toggle-left">
                  <button id="mode-basic" class="mode-btn">Basic</button>
                  <button id="mode-losiento" class="mode-btn mode-btn-active">¡Lo Siento!</button>
                </div>
              </div>
            </div>
            <div class="game-middle">
              <div class="board-panel">
                <div id="track-grid" class="track-grid hidden"></div>
                <div id="losiento-board-wrapper" class="losiento-board-wrapper">
                  <div id="losiento-board" class="losiento-board">
                    <img src="assets/board.png" alt="¡Lo Siento! Board" class="losiento-board-bg" />
                    <div id="losiento-highlights" class="losiento-highlights"></div>
                    <div id="losiento-pawns" class="losiento-pawns"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="game-right">
              <div class="game-top-row">
                <div class="game-top-primary">
                  <button id="turn-action">Play turn</button>
                </div>
                <div class="game-top-turn">
                  <div id="turn-blurb" class="turn-blurb"></div>
                </div>
              </div>
              <div class="card">
                <h3>Card history</h3>
                <div id="card-history"></div>
              </div>
              <div class="sound-controls">
                <button id="sound-skip" class="sound-btn" title="Skip Song">⏭️</button>
                <button id="sound-mute-music" class="sound-btn sound-btn-active" title="Silence Music">🎵</button>
                <button id="sound-mute-all" class="sound-btn sound-btn-active" title="Silence All Sound">🔊</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
  </body>
</html>
